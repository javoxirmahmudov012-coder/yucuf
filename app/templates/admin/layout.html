<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Boshqaruv Paneli | KASSETALAR.UZ{% endblock %}</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            retro: {
              amber: '#f59e0b',
              dark: '#0d0f12',
              card: '#161920',
              border: '#262c38'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-[#0d0f12] text-gray-200 min-h-screen flex selection:bg-amber-500 selection:text-black">

  <!-- Sidebar -->
  <aside class="w-64 bg-[#12151b] border-r border-gray-800 flex flex-col justify-between hidden md:flex flex-shrink-0">
    <div class="p-6 space-y-8">
      
      <!-- Brand -->
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-amber-500 rounded-lg flex items-center justify-center text-black font-black">
          <i data-lucide="disc" class="w-5 h-5"></i>
        </div>
        <div>
          <span class="text-lg font-black text-white font-retro">KASSETALAR</span>
          <span class="block text-[10px] text-amber-500 font-bold uppercase tracking-widest -mt-1">ADMIN PANEL</span>
        </div>
      </a>

      <!-- Nav Links -->
      <nav class="space-y-1.5 text-xs font-semibold">
        <a href="/admin" class="flex items-center gap-3 px-4 py-3 rounded-xl {% if active_page == 'dashboard' %}bg-amber-500 text-black font-bold shadow-lg shadow-amber-500/20{% else %}text-gray-400 hover:text-white hover:bg-gray-800/60{% endif %} transition-all">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Dashboard</span>
        </a>

        <a href="/admin/products" class="flex items-center gap-3 px-4 py-3 rounded-xl {% if active_page == 'products' %}bg-amber-500 text-black font-bold shadow-lg shadow-amber-500/20{% else %}text-gray-400 hover:text-white hover:bg-gray-800/60{% endif %} transition-all">
          <i data-lucide="disc" class="w-4 h-4"></i>
          <span>Mahsulotlar (Kassetalar)</span>
        </a>

        <a href="/admin/orders" class="flex items-center gap-3 px-4 py-3 rounded-xl {% if active_page == 'orders' %}bg-amber-500 text-black font-bold shadow-lg shadow-amber-500/20{% else %}text-gray-400 hover:text-white hover:bg-gray-800/60{% endif %} transition-all">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          <span>Buyurtmalar</span>
        </a>

        <a href="/admin/promos" class="flex items-center gap-3 px-4 py-3 rounded-xl {% if active_page == 'promos' %}bg-amber-500 text-black font-bold shadow-lg shadow-amber-500/20{% else %}text-gray-400 hover:text-white hover:bg-gray-800/60{% endif %} transition-all">
          <i data-lucide="tag" class="w-4 h-4"></i>
          <span>Promokodlar</span>
        </a>

        <a href="/admin/settings" class="flex items-center gap-3 px-4 py-3 rounded-xl {% if active_page == 'settings' %}bg-amber-500 text-black font-bold shadow-lg shadow-amber-500/20{% else %}text-gray-400 hover:text-white hover:bg-gray-800/60{% endif %} transition-all">
          <i data-lucide="settings" class="w-4 h-4"></i>
          <span>Sozlamalar</span>
        </a>
      </nav>

    </div>

    <!-- Bottom Actions -->
    <div class="p-6 border-t border-gray-800 space-y-3">
      <a href="/" target="_blank" class="flex items-center justify-between px-3 py-2 text-xs text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition-colors">
        <span class="flex items-center gap-2">
          <i data-lucide="external-link" class="w-4 h-4"></i> Do'konga o'tish
        </span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      </a>

      <div class="text-[10px] text-gray-600 text-center">
        Versiya 1.0 (2026)
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="flex-1 flex flex-col min-w-0">
    
    <!-- Top Bar -->
    <header class="h-16 bg-[#12151b] border-b border-gray-800 px-6 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <!-- Mobile Menu Toggle -->
        <a href="/admin" class="md:hidden text-gray-400 hover:text-white">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </a>
        <h2 class="text-sm font-bold text-white uppercase tracking-wider">{% block header_title %}Boshqaruv Paneli{% endblock %}</h2>
      </div>

      <div class="flex items-center gap-4">
        <a href="/admin/products/new" class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs rounded-lg transition-colors flex items-center gap-1.5 shadow">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Yangi Kasseta</span>
        </a>
        <div class="h-4 w-px bg-gray-800"></div>
        <div class="flex items-center gap-2 text-xs">
          <div class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 font-bold flex items-center justify-center border border-amber-500/30">A</div>
          <span class="font-semibold text-white">Administrator</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 p-6 lg:p-8 overflow-y-auto">
      {% block admin_content %}{% endblock %}
    </main>

  </div>

  <script src="/static/js/admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
